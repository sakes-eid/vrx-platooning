leader_pid_controller:
  ros__parameters:

    # =========================================================
    # Topics
    # =========================================================

    state_topic: "/wamv/state/vehicle"
    path_topic: "/planner/reference_path"

    left_thrust_topic: "/wamv/thrusters/left/thrust"
    right_thrust_topic: "/wamv/thrusters/right/thrust"

    left_position_topic: "/wamv/thrusters/left/pos"
    right_position_topic: "/wamv/thrusters/right/pos"

    success_topic: "/experiment/success"

    # =========================================================
    # Timing
    # =========================================================

    control_rate: 10.0

    # =========================================================
    # Normal trajectory tracking
    # =========================================================

    target_speed: 1.0
    lookahead_distance: 3.0

    goal_tolerance: 1.0

    heading_slowdown_angle: 0.8

    # =========================================================
    # Speed PID
    # =========================================================

    speed_kp: 250.0
    speed_ki: 30.0
    speed_kd: 50.0

    speed_integral_limit: 3.0

    # =========================================================
    # Heading PID
    # =========================================================

    heading_kp: 300.0
    heading_ki: 15.0
    heading_kd: 60.0

    heading_integral_limit: 1.5

    # =========================================================
    # Brake PID
    #
    # Target signed surge velocity = 0 m/s.
    #
    # I and D start at zero so that adding the PID architecture
    # does not introduce untested braking behaviour yet.
    # =========================================================

    brake_kp: 450.0
    brake_ki: 0.0
    brake_kd: 0.0

    brake_integral_limit: 1.0

    max_brake_thrust: 500.0

    stop_speed_tolerance: 0.05

    # =========================================================
    # Recovery
    # =========================================================

    # Slow target approach after a failed stop.
    recovery_target_speed: 0.25
    recovery_brake_distance: 0.75
    # Must become this well aligned before moving forward.
    # 0.15 rad ≈ 8.6 degrees.
    recovery_align_tolerance: 0.15

    # Stop approaching and align again above this value.
    # 0.35 rad ≈ 20 degrees.
    recovery_realign_tolerance: 0.35

    recovery_max_forward_thrust: 250.0

    recovery_max_turn_thrust: 250.0

    # =========================================================
    # Hold / success
    # =========================================================

    hold_duration: 5.0

    # =========================================================
    # General thruster limits
    # =========================================================

    max_forward_thrust: 700.0

    max_turn_thrust: 400.0

    max_total_thrust: 1000.0
